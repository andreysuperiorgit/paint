<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Superior OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font:12px "Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;color:#000}
#desk{position:fixed;inset:0;overflow:hidden;opacity:0;transition:opacity .8s}
#desk.on{opacity:1}
.wall{position:absolute;inset:0;background:
 radial-gradient(ellipse 70% 55% at 78% 108%,#e9f7a0 0%,#9bdc5a 22%,transparent 60%),
 radial-gradient(ellipse 80% 60% at 10% 100%,#1fae8a 0%,transparent 60%),
 radial-gradient(ellipse 60% 70% at 15% 0%,#04243d 0%,transparent 70%),
 linear-gradient(155deg,#031c33 0%,#07506e 38%,#11907f 66%,#5cc46a 100%)}
.wall svg{position:absolute;inset:0;width:100%;height:100%}
/* icons */
#icons{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.ic{width:78px;padding:5px 2px 4px;text-align:center;color:#fff;border:1px solid transparent;border-radius:3px;text-shadow:0 1px 2px #000,0 0 3px #000;cursor:default}
.ic:hover,.ic.sel{background:rgba(180,220,255,.22);border-color:rgba(200,230,255,.5)}
.ic i{display:block;font-style:normal;font-size:36px;line-height:42px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
/* sidebar */
#side{position:absolute;right:0;top:0;bottom:36px;width:150px;padding:14px 10px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,10,20,.38) 30%,rgba(0,10,20,.5));display:flex;flex-direction:column;gap:14px;align-items:center}
.gad{width:128px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.55)}
#slide{height:92px;border:4px solid #f4f4f4;transition:background 1.2s}
#note{background:linear-gradient(#fff9a8,#f3e56b);padding:8px 9px;font:13px "Segoe Print","Bradley Hand","Comic Sans MS",cursive;transform:rotate(-2deg);border-radius:2px}
#cpu{height:74px;background:radial-gradient(circle at 34% 55%,#2b3a46 0 26px,transparent 27px),radial-gradient(circle at 74% 62%,#2b3a46 0 18px,transparent 19px),linear-gradient(#56646f,#1c252c);position:relative;border:1px solid #8a98a3}
#cpu b{position:absolute;width:2px;background:#ff5a3c;transform-origin:50% 100%;border-radius:2px;transition:transform .7s}
#cpu b.a{left:43px;top:21px;height:20px}#cpu b.b{left:94px;top:32px;height:14px}
/* taskbar */
#bar{position:absolute;left:0;right:0;bottom:0;height:36px;display:flex;align-items:center;padding-left:58px;gap:4px;color:#fff;
 background:linear-gradient(rgba(120,140,160,.55) 0,rgba(40,50,60,.7) 8%,rgba(8,10,14,.86) 50%,rgba(0,0,0,.92));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.35)}
#orb{position:absolute;left:5px;bottom:-3px;width:48px;height:48px;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 50% 22%,#d8f4ff 0,#5bb5ea 26%,#1763b4 58%,#082c63 100%);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 0 4px rgba(10,30,60,.8),0 0 14px rgba(110,200,255,.7);display:grid;place-items:center;transition:filter .15s}
#orb:hover,#orb.on{filter:brightness(1.35) saturate(1.2)}
.ql{width:26px;height:26px;display:grid;place-items:center;font-size:16px;border-radius:3px;cursor:pointer}
.ql:hover{background:rgba(255,255,255,.22)}
#tasks{display:flex;gap:3px;margin-left:8px;flex:1;min-width:0}
.tk{height:28px;min-width:60px;max-width:170px;flex:1;padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;border-radius:3px;border:1px solid rgba(255,255,255,.28);background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.04) 50%,rgba(0,0,0,.2));cursor:pointer;font-size:12px}
.tk.act{background:linear-gradient(rgba(170,220,255,.5),rgba(60,120,190,.35));border-color:rgba(200,235,255,.7)}
#tray{padding:0 12px 0 10px;height:100%;display:flex;align-items:center;gap:9px;border-left:1px solid rgba(255,255,255,.18);font-size:12px}
/* windows */
#wins{position:absolute;inset:0 0 36px 0;perspective:1600px;pointer-events:none}
#wins.flip{background:rgba(0,8,20,.45);pointer-events:auto;transition:background .3s}
.win{position:absolute;pointer-events:auto;padding:0 7px 7px;border-radius:8px 8px 6px 6px;
 background:linear-gradient(115deg,rgba(255,255,255,.42) 0,rgba(190,215,235,.22) 30%,rgba(255,255,255,.3) 46%,rgba(170,200,225,.22) 70%,rgba(255,255,255,.28));
 backdrop-filter:blur(9px) saturate(1.2);-webkit-backdrop-filter:blur(9px) saturate(1.2);
 border:1px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 12px 38px rgba(0,0,0,.6);display:flex;flex-direction:column}
.win.blur{filter:saturate(.75);box-shadow:0 0 0 1px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.4)}
#wins.flip .win{transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer}
#wins.flip .win *{pointer-events:none}
.tb{height:28px;display:flex;align-items:center;gap:6px;padding-left:2px;font-size:12px;text-shadow:0 0 6px #fff,0 0 10px #fff,0 0 14px #fff;cursor:default;flex:none}
.tb span{flex:1;white-space:nowrap;overflow:hidden}
.cb{display:flex;align-self:flex-start;border:1px solid rgba(0,0,0,.5);border-top:0;border-radius:0 0 5px 5px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.cb b{width:27px;height:18px;display:grid;place-items:center;color:#fff;font:bold 11px Arial;text-shadow:0 0 2px #000;background:linear-gradient(rgba(255,255,255,.45),rgba(120,140,160,.35) 50%,rgba(60,80,100,.4) 51%,rgba(160,190,210,.4));border-left:1px solid rgba(0,0,0,.35);cursor:pointer}
.cb b:first-child{border-left:0}.cb b:hover{filter:brightness(1.4)}
.cb b.x{width:44px;background:linear-gradient(#f0a79a,#d0553f 50%,#b3200a 51%,#e0694f)}
.win iframe{flex:1;border:0;width:100%;height:100%;display:block;background:#000}
body.drag iframe{pointer-events:none}
.addr{flex:none;display:flex;gap:6px;align-items:center;padding:3px 8px;background:linear-gradient(#fff,#e9eef5);border-bottom:1px solid #c5ccd6;color:#2a5aa0}
.addr span{flex:1;padding:2px 6px;border:1px solid #9fb3cc;background:#fff;border-radius:2px;white-space:nowrap;overflow:hidden}
.body{position:relative;flex:1;background:#f0f0f0;border:1px solid rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(255,255,255,.55);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.menu{display:flex;background:linear-gradient(#fff,#e9eef5);border-bottom:1px solid #c5ccd6;flex:none}
.pdrop{position:absolute;z-index:5;display:none;min-width:170px;background:#f5f6f7;border:1px solid #979797;box-shadow:2px 3px 6px rgba(0,0,0,.35);padding:2px}
.pdrop.on{display:block}.pdrop a{display:flex;justify-content:space-between;gap:18px;padding:4px 10px 4px 24px;cursor:default}.pdrop a:hover{background:#cfe4fb;outline:1px solid #7da2ce}.pdrop a s{text-decoration:none;color:#666}
.menu u{text-decoration:none;padding:3px 8px;cursor:default}.menu u:hover{background:#cfe4fb;outline:1px solid #7da2ce}
.stat{flex:none;border-top:1px solid #c5ccd6;background:#f0f0f0;padding:3px 8px;color:#333;display:flex;gap:16px}
/* paint */
.pm{flex:1;display:flex;min-height:0}
.ptools{flex:none;width:58px;padding:4px 3px;display:grid;grid-template-columns:25px 25px;grid-auto-rows:25px;gap:1px;align-content:start;background:#f0f0f0;border-right:1px solid #c5ccd6}
.ptools b{display:grid;place-items:center;font-size:14px;font-weight:400;border:1px solid transparent;border-radius:2px;cursor:pointer}
.ptools b:hover{border-color:#7da2ce;background:#e3f0fd}.ptools b.on{border-color:#3d7bc4;background:#bfdcfa;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.parea{flex:1;background:#abb8c7;padding:5px;overflow:hidden}
.parea canvas{display:block;background:#fff;box-shadow:1px 1px 0 #555;cursor:crosshair}
.pcol{flex:none;display:flex;align-items:center;gap:8px;padding:5px 6px;background:#f0f0f0;border-top:1px solid #c5ccd6}
.pcur{width:32px;height:32px;position:relative;border:1px solid #888;background:#fff;box-shadow:inset 1px 1px 0 #555}
.pcur i{position:absolute;width:15px;height:15px;border:1px solid #666}
.pcur i.bg{right:3px;bottom:3px}.pcur i.fg{left:3px;top:3px}
.ppal{display:grid;grid-template-columns:repeat(14,16px);gap:1px}
.ppal b{height:16px;border:1px solid #666;box-shadow:inset 1px 1px 0 #fff;cursor:pointer}
/* solitaire */
.felt{position:relative;width:606px;height:430px;background:radial-gradient(ellipse at 50% 35%,#2f9a4c,#0d5a26 85%);overflow:hidden}
.felt canvas{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;width:70px;height:96px;background-size:70px 96px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.45);cursor:pointer}
.slot{position:absolute;width:70px;height:96px;border-radius:6px;border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.12)}
/* mines */
.mgrid{display:grid;grid-template-columns:repeat(9,26px);gap:1px;padding:10px;background:linear-gradient(#5d7aa8,#2c4573)}
.mgrid b{height:26px;display:grid;place-items:center;font:bold 14px Arial;border-radius:2px;background:linear-gradient(135deg,#9cc0f5,#3e6fcf);box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),inset -1px -1px 0 rgba(0,0,0,.3);cursor:pointer}
.mgrid b.o{background:linear-gradient(135deg,#e9eef7,#c9d3e4);box-shadow:inset 0 0 0 1px #b3bdd0}
.mgrid b.boom{background:#f0624d}
/* start menu */
#start{position:absolute;left:0;bottom:36px;width:400px;height:430px;display:none;padding:8px;border-radius:8px 8px 0 0;background:linear-gradient(rgba(70,90,110,.72),rgba(10,16,24,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.6);color:#fff;z-index:9000}
#start.on{display:flex;gap:8px}
#start .l{flex:1.25;background:#fff;color:#000;border-radius:4px;display:flex;flex-direction:column;padding:6px}
#start .l a,#start .r a{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:3px;cursor:pointer;border:1px solid transparent}
#start .l a i{font-style:normal;font-size:24px;width:30px;text-align:center}
#start .l a:hover{background:linear-gradient(#e6f2fe,#cbe2fb);border-color:#8fb5df}
#start .l .s{margin-top:auto;border:1px solid #9ab;border-radius:3px;padding:5px 7px;color:#789;font-style:italic}
#start .r{flex:1;display:flex;flex-direction:column;padding-top:44px}
#start .r a:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
#start .r .pw{margin-top:auto;align-self:flex-start;padding:5px 16px;border-radius:4px;border:1px solid #f2b7a5;background:linear-gradient(#e98b6e,#b8351a 50%,#96200a 51%,#cf5a3b);cursor:pointer;font-weight:600}
/* uac */
#uac{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.66);z-index:20000}
#uac.on{display:grid}
#uac .d{width:440px;background:#f0f0f0;border-radius:7px;border:1px solid rgba(255,255,255,.7);box-shadow:0 0 0 1px #000,0 16px 50px #000;overflow:hidden;animation:pop .18s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#uac .h{background:linear-gradient(#1d7a70,#0e4a52);color:#fff;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:center}
#uac .h i{font-style:normal;font-size:26px}
#uac .m{padding:14px 16px;background:#fff;line-height:1.5}
#uac .m p{margin:0 0 8px}#uac .m .a{display:flex;gap:10px;align-items:center;margin:10px 0 2px;padding:8px;background:#f4f7fb;border:1px solid #d5dde8}
#uac .m .a i{font-style:normal;font-size:28px}
#uac .f{padding:10px 14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #d0d0d0}
.btn{min-width:78px;padding:4px 12px;border:1px solid #707070;border-radius:3px;background:linear-gradient(#f6f6f6,#e4e4e4 50%,#d4d4d4 51%,#e8e8e8);text-align:center;cursor:pointer}
.btn:hover,.btn.hot{border-color:#3c7fb1;background:linear-gradient(#eaf6fd,#d9f0fc 50%,#bee6fd 51%,#a7d9f5);box-shadow:inset 0 0 0 1px #fff}
/* boot / shutdown */
#boot{position:fixed;inset:0;background:#000;z-index:30000;color:#c8c8c8;display:grid;place-items:center;transition:opacity .7s}
#bios{position:absolute;left:24px;top:20px;font:14px Menlo,Consolas,monospace;white-space:pre;line-height:1.5}
#load{display:none;text-align:center}
#load .pb{width:170px;height:16px;border:1px solid #9aa;border-radius:5px;overflow:hidden;position:relative;margin:0 auto 26px;box-shadow:inset 0 0 6px #456}
#load .pb i{position:absolute;top:2px;width:40px;height:10px;background:repeating-linear-gradient(90deg,#7fe04a 0 10px,transparent 10px 13px);animation:sl 1.3s linear infinite;filter:drop-shadow(0 0 3px #6f6)}
@keyframes sl{from{left:-44px}to{left:174px}}
#load small{color:#9a9a9a;font:11px Arial}
#glow{display:none;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#e9fbff,#62c0f0 30%,#1763b4 62%,#061f48);box-shadow:0 0 70px 22px rgba(90,200,255,.55);place-items:center;animation:gl 1.2s ease-out}
@keyframes gl{from{transform:scale(.3);opacity:0;filter:brightness(3)}}
#welcome{position:fixed;inset:0;z-index:25000;display:none;place-items:center;color:#fff;font-size:22px;text-shadow:0 1px 4px #000;transition:opacity .6s}
#welcome .ed{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:17px;opacity:.9}
.spin{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
#cur{position:fixed;left:0;top:0;z-index:40000;pointer-events:none;display:none;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.5))}
body.demo{cursor:none}body.demo *{cursor:none!important}
</style></head><body>

<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms)), Q=new URLSearchParams(location.search), DEMO=Q.has('demo');
const wins=$('#wins'); let Z=10, open={}, uacCount=0;

/* ---------- window manager ---------- */
function focusW(w){w.style.zIndex=++Z;w.style.display='flex';document.querySelectorAll('.win').forEach(x=>x.classList.toggle('blur',x!==w));document.querySelectorAll('.tk').forEach(t=>t.classList.toggle('act',t===w.tk))}
function mkWin(id,title,icon,w,h,x,y){
  w=Math.min(w,innerWidth-(innerWidth<700?8:180));h=Math.min(h,innerHeight-48);x=Math.max(4,Math.min(x,innerWidth-w-4));y=Math.max(0,Math.min(y,innerHeight-h-40));
  const W=el('div','win');W.style.cssText=`width:${w}px;height:${h}px;left:${x}px;top:${y}px`;
  W.innerHTML=`<div class="tb"><i style="font-style:normal;font-size:15px">${icon}</i><span>${title}</span><div class="cb"><b class="mn">─</b><b class="mx">☐</b><b class="x">✕</b></div></div><div class="body"></div>`;
  const tb=W.querySelector('.tb');let d=null;
  tb.onpointerdown=e=>{if(e.target.closest('.cb')||wins.classList.contains('flip'))return;focusW(W);d=[e.clientX-W.offsetLeft,e.clientY-W.offsetTop];document.body.classList.add('drag');tb.setPointerCapture(e.pointerId)};
  tb.onpointermove=e=>{if(d){W.style.left=e.clientX-d[0]+'px';W.style.top=Math.max(0,e.clientY-d[1])+'px'}};
  tb.onpointerup=()=>{d=null;document.body.classList.remove('drag')};
  W.addEventListener('pointerdown',()=>{if(!wins.classList.contains('flip'))focusW(W)},true);
  W.querySelector('.x').onclick=()=>{W.remove();W.tk.remove();delete open[id]};
  W.querySelector('.mn').onclick=()=>{W.style.display='none';W.tk.classList.remove('act')};
  let mx=null;W.querySelector('.mx').onclick=()=>{if(mx){W.style.cssText=mx;mx=null}else{mx=W.style.cssText;W.style.cssText=`left:0;top:0;width:100%;height:100%;z-index:${Z}`}};
  W.tk=el('div','tk',`<span>${icon}</span>${title}`);W.tk.onclick=()=>{(W.style.display==='none'||W.classList.contains('blur'))?focusW(W):W.querySelector('.mn').click()};
  $('#tasks').append(W.tk);wins.append(W);open[id]=W;focusW(W);return W.querySelector('.body');
}
function uac(name,icon,cb){uacCount++;$('#uname').textContent=name;$('#uico').textContent=icon;$('#uac').classList.add('on');
  $('#uok').onclick=()=>{$('#uac').classList.remove('on');cb()};$('#uno').onclick=()=>$('#uac').classList.remove('on')}
const WEB={v8:['V8 Engine','⚙️','https://andreysuperiorgit.github.io/v8/',760,500],riemann:['Riemann, live','∿','https://andreysuperiorgit.github.io/riemann/',760,500],afterglow:['Afterglow','🌅','https://andreysuperiorgit.github.io/afterglow/',760,500],neonamp:['NEONAMP','🎵','neonamp.html',560,420]};

  const cv=b.querySelector('canvas'),g=cv.getContext('2d',{willReadFrequently:true}),W=600,H=360;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.lineCap=g.lineJoin='round';

  const tb=b.querySelector('.ptools');TL.forEach(([k,i])=>{const e=el('b','',i);e.dataset.t=k;e.onclick=()=>P.setTool(k);tb.append(e)});
  const COL='#000000 #808080 #800000 #808000 #008000 #008080 #000080 #800080 #808040 #004040 #0080ff #004080 #4000ff #804000 #ffffff #c0c0c0 #ff0000 #ffff00 #00ff00 #00ffff #0000ff #ff00ff #ffff80 #00ff80 #80ffff #8080ff #ff0080 #ff8040'.split(' ');
  const pal=b.querySelector('.ppal');COL.forEach(c=>{const e=el('b');e.style.background=c;e.dataset.c=c;e.onclick=()=>P.setColor(c);e.oncontextmenu=ev=>{ev.preventDefault();P.bg=c;b.querySelector('.bg').style.background=c};pal.append(e)});
  P.el=b;P.cv=cv;P.bg='#ffffff';
  P.setTool=k=>{P.tool=k;tb.querySelectorAll('b').forEach(x=>x.classList.toggle('on',x.dataset.t===k))};
  P.setColor=c=>{P.fg=c;b.querySelector('.fg').style.background=c};
  b.querySelector('.bg').style.background='#fff';P.setTool('pencil');P.setColor('#000000');
  const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
  function flood(x,y,col){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const id=g.getImageData(0,0,W,H),d=id.data,seen=new Uint8Array(W*H),i0=(y*W+x)*4,t=[d[i0],d[i0+1],d[i0+2]],c=hex(col);
    const m=p=>!seen[p]&&Math.abs(d[p*4]-t[0])+Math.abs(d[p*4+1]-t[1])+Math.abs(d[p*4+2]-t[2])<90,st=[y*W+x];
    while(st.length){const p=st.pop();if(!m(p))continue;const cy=(p/W)|0;let l=p,r=p;while(l>cy*W&&m(l-1))l--;while(r<cy*W+W-1&&m(r+1))r++;
      for(let k=l;k<=r;k++){seen[k]=1;d[k*4]=c[0];d[k*4+1]=c[1];d[k*4+2]=c[2];d[k*4+3]=255;if(cy>0&&m(k-W))st.push(k-W);if(cy<H-1&&m(k+W))st.push(k+W)}}
    g.putImageData(id,0,0)}
  let dn=null,snap=null;

    dn=[x,y];snap=g.getImageData(0,0,W,H);g.strokeStyle=g.fillStyle=t==='eraser'?P.bg:P.fg;g.lineWidth=t==='brush'?6:t==='eraser'?14:t==='pencil'?1.5:2.5;
    if(t==='pencil'||t==='brush'||t==='eraser'){g.beginPath();g.moveTo(x,y);g.lineTo(x+.01,y);g.stroke()}};

const cur=$('#cur');let cx=innerWidth*.55,cy=innerHeight*.6;
function mv(x,y,ms=450){return new Promise(res=>{const x0=cx,y0=cy,t0=performance.now();(function f(t){let k=Math.min(1,(t-t0)/ms);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cx=x0+(x-x0)*k;cy=y0+(y-y0)*k;cur.style.transform=`translate(${cx}px,${cy}px)`;k<1?requestAnimationFrame(f):res()})(t0)})}
const ctr=e=>{const r=e.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
async function clk(e,ms=450,fn){await mv(...ctr(e),ms);await sleep(90);fn?fn():e.click();await sleep(160)}
const cp=(x,y)=>{const r=P.cv.getBoundingClientRect();return[r.left+x,r.top+y]};
async function stroke(pts,step=16){await mv(...cp(...pts[0]),350);P.pd(...pts[0]);for(const p of pts.slice(1)){await mv(...cp(...p),step);P.pm(...p)}P.pu();await sleep(120)}

  await run('riemann');await sleep(2200);
  await run('paint');await sleep(250);
  await tool('brush');await col('#004080');const ch=[[30,320],[110,290],[170,300],[240,240],[300,255],[380,170],[440,190],[520,90],[575,60]];
  const pts=[];for(let i=0;i<ch.length-1;i++)for(let t=0;t<1;t+=.25)pts.push([ch[i][0]+(ch[i+1][0]-ch[i][0])*t,ch[i][1]+(ch[i+1][1]-ch[i][1])*t]);pts.push(ch.at(-1));await stroke(pts,22);
